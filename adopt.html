<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Adoption Inquiry | PetAdopt</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">PetAdopt</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="pets.html">Available Pets</a></li>
        <li><a href="calculator.html">Cost Calculator</a></li>
        <li><a href="adopt.html">Adopt</a></li>
      </ul>
    </nav>
  </header>
  <section class="page-heading">
    <h1>Adoption Inquiry Form</h1>
    <p>Fill out the form below and we'll get in touch with you shortly.</p>
  </section>
  <section class="adoption-form">
    <form action="https://formsubmit.co/your-email@example.com" method="POST">
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required>
      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" required>
      <label for="pet">Pet You're Interested In:</label>
      <input type="text" id="pet" name="pet" placeholder="e.g., Buddy the Labrador" required>
      <label for="message">Why do you want to adopt?</label>
      <textarea id="message" name="message" rows="4" required></textarea>
      <input type="hidden" name="_captcha" value="false">
      <button type="submit" class="btn">Submit Inquiry</button>
    </form>
  </section>
  <footer>
    <p>&copy; 2025 PetAdopt. All rights reserved.</p>
    <p>Email: info@petadopt.com | Phone: (03) 1234 5678</p>
  </footer>
</body>
</html>
